name: Morning Pre-Market Alert

on:
  schedule:
    # 8:30 AM IST = 3:00 AM UTC (Mon-Fri)
    - cron: '0 3 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  morning-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The evening workflow commits trade_plan.json to the repo, so a fresh
      # checkout of main already has the latest plan — no artifact handoff needed.
      - name: Run Morning Pipeline
        env:
          WEBEX_TOKEN: ${{ secrets.WEBEX_TOKEN }}
          WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
        run: python -m hermes.cli morning

      - name: Commit Database changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_data.db || true
          git add -f morning_trade_plan.json || true
          git commit -m "Auto-update market_data.db and morning plan [skip ci]" || echo "No changes to commit"
          git push

