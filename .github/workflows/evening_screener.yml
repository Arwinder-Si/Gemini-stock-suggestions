# ============================================================
# Evening Pipeline — Runs Mon-Fri at 3:45 PM IST (10:15 UTC)
# ============================================================
# Scans all 152 stocks, generates trade plan, sends Webex alert

name: Evening Screener Pipeline

on:
  schedule:
    # 3:45 PM IST = 10:15 AM UTC (Mon-Fri)
    - cron: '15 10 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Evening Pipeline
        env:
          WEBEX_TOKEN: ${{ secrets.WEBEX_TOKEN }}
          WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
        # market_snapshot and outcome_enricher require MongoDB (absent in CI) and
        # are skipped automatically, but we exclude them explicitly for clarity.
        run: python -m hermes.cli evening --skip market_snapshot,outcome_enricher

      - name: Commit trade plan and database changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_data.db || true
          # Trade plans and screener outputs are gitignored locally but committed
          # from CI so the morning workflow can read them on a fresh checkout.
          git add -f trade_plan.json trade_plan_smallcap.json screener_results.csv market_regime.txt || true
          git commit -m "Auto-update trade plan and market_data.db [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screener-results-${{ github.run_number }}
          path: |
            screener_results.csv
            news_features.csv
            trade_plan.json
            trade_plan_smallcap.json
          retention-days: 30
